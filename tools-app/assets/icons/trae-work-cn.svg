    </filter>
  </defs>
  <rect width="64" height="64" rx="14" ry="14" fill="url(#traeWorkGrad)" filter="url(#traeWorkGlow)"/>
  <text x="26" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="white" text-anchor="middle">T</text>
