<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#116BFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D55CC;stop-opacity:1" />
    </linearGradient>
    <filter id="cgGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" ry="14" fill="url(#cgGrad)" filter="url(#cgGlow)"/>
  <text x="32" y="43" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">G</text>
</svg>
