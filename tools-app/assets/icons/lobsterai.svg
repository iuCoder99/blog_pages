<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad_lobster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:0.8" />
    </linearGradient>
    <filter id="glow_lobster">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" ry="14" fill="url(#grad_lobster)" filter="url(#glow_lobster)"/>
  <text x="32" y="43" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="bold" fill="white" text-anchor="middle">L</text>
</svg>
